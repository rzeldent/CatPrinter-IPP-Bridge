name: PlatformIO CI
on: [push]

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32-S3 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build firmware
        run: platformio run -e esp32s3-psram

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: esp32s3-psram
          path: |
            .pio/build/esp32s3-psram/firmware.bin
            .pio/build/esp32s3-psram/firmware.elf
          if-no-files-found: error
